# =========================================================
# Load .env file
# =========================================================
spring.config.import=optional:file:.env[.properties]


# =========================================================
# Application
# =========================================================
spring.application.name=${APP_NAME:notification-service}
server.port=${SERVER_PORT:8083}


# =========================================================
# Datasource (values from .env)
# =========================================================
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}


# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=update


# =========================================================
# Actuator & Eureka
# =========================================================
management.endpoints.web.exposure.include=*
eureka.instance.prefer-ip-address=true


# =========================================================
# Kafka Consumer
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Type mapping (line continuation with \, no spaces after commas)
spring.kafka.consumer.properties.spring.json.type.mapping=\
  com.example.userAccountService.kafka.dto.UserRegistrationEvent:com.example.notificationService.kafka.dto.UserRegistrationEvent,\
  com.example.transactionService.kafka.dto.BalanceUpdateEvent:com.example.notificationService.kafka.dto.BalanceUpdateEvent


# =========================================================
# Mail (values from .env)
# =========================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true